name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true

      - name: Normalize modules
        run: go mod tidy

      - name: Export module metadata
        uses: actions/upload-artifact@v4
        with:
          name: go-module-metadata
          path: |
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 1

      - name: Verify module metadata is committed
        run: git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          files=$(gofmt -l ./cmd ./internal)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build commands
        run: go build ./cmd/...

      - name: Start PostgreSQL 18
        run: |
          docker run -d --rm --name telegram-gateway-ci-postgres \
            -e POSTGRES_DB=telegram_gateway \
            -e POSTGRES_USER=telegram_gateway \
            -e POSTGRES_PASSWORD=ci-password \
            postgres:18.6-alpine
          for i in $(seq 1 30); do
            if docker exec telegram-gateway-ci-postgres pg_isready -U telegram_gateway -d telegram_gateway; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Apply database migrations
        run: |
          for file in $(find migrations -maxdepth 1 -name '*.up.sql' | sort); do
            echo "Applying $file"
            docker exec -i telegram-gateway-ci-postgres \
              psql -v ON_ERROR_STOP=1 -U telegram_gateway -d telegram_gateway < "$file"
          done

      - name: Roll back database migrations
        run: |
          for file in $(find migrations -maxdepth 1 -name '*.down.sql' | sort -r); do
            echo "Rolling back $file"
            docker exec -i telegram-gateway-ci-postgres \
              psql -v ON_ERROR_STOP=1 -U telegram_gateway -d telegram_gateway < "$file"
          done
