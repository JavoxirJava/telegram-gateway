name: TDLib validation

on:
  push:
    branches: [feat/tdlib-runtime]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdlib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2.9-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: telegram_gateway
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: telegram_gateway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U telegram_gateway -d telegram_gateway"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://telegram_gateway:ci-password@localhost:5432/telegram_gateway?sslmode=disable
      PGPASSWORD: ci-password
      TEST_REDIS_ADDR: localhost:6379
      TEST_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: git archive --format=tar.gz --output=/tmp/gateway-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-source
          path: /tmp/gateway-source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Apply database migrations
        run: |
          for file in $(find migrations -maxdepth 1 -name '*.up.sql' | sort); do
            psql -h localhost -U telegram_gateway -d telegram_gateway -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Start account wakeup test server
        run: docker run -d --rm --name gateway-test-nats -p 127.0.0.1:4222:4222 nats:2.14.6-alpine -js
      - name: Validate least-privilege role setup
        run: |
          psql -h localhost -U telegram_gateway -d telegram_gateway -v ON_ERROR_STOP=1 < deployments/roles.sql
      - name: Unit and PostgreSQL integration tests
        run: go test -race -count=1 ./...
      - name: Native ABI fixture and race tests
        run: CGO_ENABLED=1 go test -race -tags tdlib -count=1 ./internal/tdjson/... ./internal/tdlib ./internal/sessionkey ./internal/tglive
      - run: go vet ./...
      - run: go build ./cmd/...
      - name: Build native agent
        run: CGO_ENABLED=1 go build -tags tdlib ./cmd/tdlib-agent
      - name: Roll back migrations
        run: |
          for file in $(find migrations -maxdepth 1 -name '*.down.sql' | sort -r); do
            psql -h localhost -U telegram_gateway -d telegram_gateway -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Test tracked migrations on a fresh database and repeat
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: telegram_gateway
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: gateway_migration_test
        run: |
          psql -h localhost -U telegram_gateway -d telegram_gateway -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gateway_migration_test'
          go run ./cmd/gateway-migrate
          go run ./cmd/gateway-migrate
