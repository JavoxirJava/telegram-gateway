# Optional development stack. The PC deployment uses deploy/install.py (Quadlet).
name: telegram-gateway-dev
x-app-environment: &app-environment
  POSTGRES_HOST: postgres
  REDIS_ADDR: redis:6379
  NATS_URL: nats://nats:4222
  MINIO_ENDPOINT: minio:9000
  HTTP_ADDR: :8080
  PUBLIC_URL: http://127.0.0.1:18086
  TDLIB_DATA_DIR: /data/tdlib
services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/configure.py first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: docker.io/library/redis:8.2.9-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run deploy/configure.py first}
    command: [/bin/sh, -c, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    volumes:
      - redis_data:/data
  nats:
    image: docker.io/library/nats:2.14.6-alpine
    command: [-js, -sd, /data, -m, '8222']
    volumes:
      - nats_data:/data
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-telegram-gateway}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run deploy/configure.py first}
    volumes:
      - minio_data:/data
  migrate:
    image: localhost/telegram-gateway:local
    entrypoint: [/usr/local/bin/gateway-migrate]
    env_file: .env
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: localhost/telegram-gateway:local
    env_file: .env
    environment: *app-environment
    ports:
      - 127.0.0.1:18086:8080
    volumes:
      - tdlib_data:/data:U
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      nats:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  tdlib_data:
